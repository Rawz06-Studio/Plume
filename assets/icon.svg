<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D6AF7"/>
      <stop offset="1" stop-color="#3A2A9E"/>
    </linearGradient>
    <linearGradient id="vane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E0FF"/>
    </linearGradient>
    <!-- Notches in the vane, following the direction of the barbs -->
    <mask id="notches" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="#000">
        <path d="M690 262 L690 300 L588 372 Z"/>
        <path d="M680 492 L676 528 L572 590 Z"/>
        <path d="M350 386 L352 422 L460 476 Z"/>
        <path d="M362 618 L372 652 L462 700 Z"/>
      </g>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#160C55" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background (macOS icon grid: 824px rounded square inside 1024) -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <g transform="rotate(40 512 512)" filter="url(#shadow)">
    <!-- Vane -->
    <path mask="url(#notches)" fill="url(#vane)" d="
      M528 128
      C 628 196, 664 352, 644 498
      C 626 624, 566 720, 492 792
      L 470 792
      C 400 718, 366 604, 376 470
      C 388 326, 440 206, 528 128 Z"/>
    <!-- Shaft -->
    <path d="M526 170 C 514 400, 502 610, 478 796" stroke="#3A2A9E" stroke-opacity="0.3" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- Quill -->
    <path d="M480 780 C 474 830, 466 866, 454 902" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" fill="none"/>
  </g>
</svg>
