[package]
name = "plume"
version = "0.1.3"
edition = "2024"
description = "A tiny, native REST client. No Electron, no account, no cloud."
license = "MIT"
repository = "https://github.com/Rawz06-Studio/Plume"

[dependencies]
dirs = "7.0.0"
eframe = "0.37"
raw-window-handle = "0.6"
self-replace = "1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5"

[profile.release]
strip = true
lto = true
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSVisualEffectView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSThread"] }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8"

[build-dependencies]
winresource = "0.1"
