[package]
name = "plume"
version = "0.1.0"
edition = "2024"
description = "A tiny, native REST client. No Electron, no account, no cloud."
license = "MIT"
repository = "https://github.com/Rawz06-Studio/Plume"

[dependencies]
dirs = "7.0.0"
eframe = "0.37"
self-replace = "1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5"

[profile.release]
strip = true
lto = true
codegen-units = 1

[build-dependencies]
winresource = "0.1"
